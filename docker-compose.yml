version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reddy_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-reddy_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ReddySecure2026!}
      POSTGRES_DB: ${DB_NAME:-reddy_ecommerce}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - reddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reddy_admin} -d ${DB_NAME:-reddy_ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reddy_network

  redis:
    image: redis:7-alpine
    container_name: reddy_redis
    restart: always
    command: >
      --requirepass ${REDIS_PASSWORD:-ReddyRedis2026!}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - reddy_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ReddyRedis2026!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reddy_network

volumes:
  reddy_pgdata:
    driver: local
  reddy_redisdata:
    driver: local

networks:
  reddy_network:
    driver: bridge